[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://kashif-sanitary.onrender.com/api/:splat"
  status = 200
  force = true

# Redirect all routing to index.html for Single Page Application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
